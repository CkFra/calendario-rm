name: Actualizar calendario

on:
  schedule:
    - cron: "17 */6 * * *"  # cada 6 horas (hora UTC)
  workflow_dispatch:         # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar realmadrid.ics
        run: python generar_calendario.py

      - name: Guardar si ha cambiado
        run: |
          git add docs/realmadrid.ics nombres_es.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizar calendario"
            git push
          fi
